services:
  gsplat-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: gsplat-sim:latest
    container_name: gsplat-container
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ..:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    ports:
      - "8080:8080"
